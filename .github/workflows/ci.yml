name: GasparSite CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: gaspar-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit browser runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit and integration tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand --silent

      - name: Production build
        env:
          # The legacy tree still has lint warnings tracked in docs/SECURITY.md.
          # Type errors and tests remain blocking gates above.
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      - name: Include IIS policy
        run: cp web.config build/web.config

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaspar-site-build
          path: build
          if-no-files-found: error
          retention-days: 7
